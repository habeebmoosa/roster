# Local development database: PostgreSQL 16 + pgvector, zero external accounts.
# `npm run db:up` starts it; the DATABASE_URL in .env points here by default.
#
# Roster is database-provider-agnostic — this file is only a convenience for
# local dev. Production can use any Postgres (EC2, Supabase, Neon, RDS, …)
# by changing DATABASE_URL; no code changes required.

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: roster-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: roster
      POSTGRES_PASSWORD: roster
      POSTGRES_DB: roster
    # Host port 5433 (not 5432) to avoid clashing with any Postgres already
    # running locally on 5432. Container still listens on 5432 internally.
    ports:
      - "5433:5432"
    volumes:
      - roster-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U roster -d roster"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  roster-pgdata:
