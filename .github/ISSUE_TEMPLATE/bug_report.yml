name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you expected vs. what you saw.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Provider / model (if relevant)
      description: Engine behavior can vary by model — please say which one.
  - type: textarea
    id: env
    attributes:
      label: Environment
      description: Node version, Postgres host, self-hosted or Vercel, browser.
  - type: markdown
    attributes:
      value: "Never paste API keys or secrets. For security issues use SECURITY.md instead."
